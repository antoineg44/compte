<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName compte.partitions.ovh

    DocumentRoot /var/www/compte/public

    <Directory /var/www/compte/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/compte.partitions.ovh-error.log
    CustomLog ${APACHE_LOG_DIR}/compte.partitions.ovh-access.log combined

Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/compte.partitions.ovh/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/compte.partitions.ovh/privkey.pem
</VirtualHost>
</IfModule>
